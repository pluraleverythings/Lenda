name: TestFlight

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "fastlane lane to run"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - bootstrap
  push:
    branches:
      - main

concurrency:
  # Serialise TestFlight uploads — Apple rejects duplicate build numbers from
  # racing runs.
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APP_IDENTIFIER: ${{ vars.APP_IDENTIFIER || 'com.lenda.Lenda' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Compute monotonic build number
        run: echo "BUILD_NUMBER=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run fastlane ${{ github.event.inputs.lane || 'beta' }}
        run: fastlane ${{ github.event.inputs.lane || 'beta' }}
